<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procurement Progress Report</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 40px;
    max-width: 480px;
    width: 90%;
    text-align: center;
  }
  h1 {
    font-size: 22px;
    color: #1a73e8;
    margin-bottom: 8px;
  }
  p.subtitle {
    color: #666;
    margin-bottom: 28px;
    font-size: 14px;
  }
  #signinBtn {
    background: #1a73e8;
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  #signinBtn:hover { background: #1558b0; }
  #status {
    margin-top: 24px;
    font-size: 14px;
    color: #333;
    line-height: 1.8;
    text-align: right;
  }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid #ccc;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-left: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ok { color: #1e8e3e; font-weight: 600; }
  .err { color: #d93025; font-weight: 600; }
  a.sheetLink {
    display: inline-block;
    margin-top: 14px;
    background: #1e8e3e;
    color: #fff;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card">
  <h1>Procurement Progress Report</h1>
  <p class="subtitle">نسخة تجريبية — تسجيل دخول Google وإنشاء الشيت تلقائياً</p>

  <button id="signinBtn">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 6 .1 8.3 3.1l6-6C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.1-2.7-.5-4z"/></svg>
    تسجيل الدخول بحساب Google
  </button>

  <div id="status"></div>
</div>

<script>
  // ===== ضع هنا الـ Client ID الذي حصلت عليه من Google Cloud Console =====
  const CLIENT_ID = "543026821266-teh5rbarpabeeeropf3312vnqt3pm059.apps.googleusercontent.com";

  const SCOPES = "https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file";
  const SHEET_TITLE = "Procurement Progress Report";

  const statusEl = document.getElementById('status');
  const signinBtn = document.getElementById('signinBtn');
  let tokenClient;
  let accessToken = null;

  function log(html) {
    statusEl.innerHTML = html;
  }

  function appendLog(html) {
    statusEl.innerHTML += '<div>' + html + '</div>';
  }

  window.onload = function () {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: (resp) => {
        if (resp.error) {
          log('<span class="err">حدث خطأ أثناء تسجيل الدخول: ' + resp.error + '</span>');
          return;
        }
        accessToken = resp.access_token;
        handleSignedIn();
      }
    });
  };

  signinBtn.addEventListener('click', () => {
    log('<span class="spinner"></span> جاري تسجيل الدخول...');
    tokenClient.requestAccessToken();
  });

  async function handleSignedIn() {
    log('<span class="spinner"></span> تم تسجيل الدخول، جاري البحث عن الشيت الخاص بك...');
    try {
      const existing = await findExistingSheet();
      if (existing) {
        appendLog('<span class="ok">✔ تم العثور على شيت موجود مسبقاً.</span>');
        showLink(existing.id);
      } else {
        appendLog('<span class="ok">✔ لا يوجد شيت سابق — جاري إنشاء واحد جديد...</span>');
        const newId = await createNewSheet();
        appendLog('<span class="ok">✔ تم إنشاء الشيت بنجاح!</span>');
        showLink(newId);
      }
    } catch (err) {
      console.error(err);
      appendLog('<span class="err">حدث خطأ: ' + (err.message || err) + '</span>');
    }
  }

  async function findExistingSheet() {
    const q = encodeURIComponent(
      `name='${SHEET_TITLE}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`
    );
    const res = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
      { headers: { Authorization: 'Bearer ' + accessToken } }
    );
    const data = await res.json();
    if (data.files && data.files.length > 0) {
      return data.files[0];
    }
    return null;
  }

  async function createNewSheet() {
    // 1) إنشاء الملف بالشيتات الأساسية
    const createRes = await fetch('https://sheets.googleapis.com/v4/spreadsheets', {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + accessToken,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        properties: { title: SHEET_TITLE },
        sheets: [
          { properties: { title: 'BOQ Database' } },
          { properties: { title: 'Material Submittal Status' } },
          { properties: { title: 'Lists' } }
        ]
      })
    });
    const createData = await createRes.json();
    if (createData.error) throw new Error(createData.error.message);
    const spreadsheetId = createData.spreadsheetId;

    // 2) كتابة صف عناوين أساسي بشيت BOQ Database (تجربة أولية فقط)
    await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/'BOQ Database'!A1:H1?valueInputOption=RAW`,
      {
        method: 'PUT',
        headers: {
          Authorization: 'Bearer ' + accessToken,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          values: [[
            'S/N', 'Description', 'Unit', 'Qty', 'File With', 'Main/Alt', 'Priority', 'LLI'
          ]]
        })
      }
    );

    return spreadsheetId;
  }

  function showLink(id) {
    const url = `https://docs.google.com/spreadsheets/d/${id}/edit`;
    appendLog(`<a class="sheetLink" href="${url}" target="_blank">فتح الشيت الخاص بي ↗</a>`);
  }
</script>

</body>
</html>
